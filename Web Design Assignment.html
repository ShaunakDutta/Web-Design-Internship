
<!DOCTYPE html>
<!-- Tells the browser to use modern HTML5 standards. -->

<html lang="en">
<!-- Starts the HTML document. -->

<head>
    <meta charset="UTF-8">
    <!-- Supports letters and symbols. -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Helps the webpage fit different screen sizes. -->

    <title>Web Design Assignment</title>
    <!-- Sets the browser tab title. -->

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .container {
            border: 1px solid black;
            padding: 4px;
            margin: 20px auto;
            width: 90%;
        }

        .paragraphs {
            background-color: orange;
            font-size: 10px;
            color: green;
            padding: 2px;
        }

        h1 {
            color: red;
            font-size: 24px;
        }

        h2 {
            color: blueviolet;
            font-size: 20px;
        }

        h3 {
            color: aqua;
        }

        h4 {
            color: navy;
        }

        h5 {
            color: brown;
        }

        h6 {
            color: green;
        }

        .image-section {
            display: flex;
            background-color: grey;
            min-height: 150px;
        }

        .image-section img {
            width: 35%;
            object-fit: cover;
        }

        .grey-area {
            flex: 1;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="paragraphs">
            <p>This is a paragraph.</p>
            <p>This is a paragraph 2.</p>
        </div>

        <h1>This is heading h1.</h1>
        <h2>This is heading h2.</h2>
        <h3>This is heading h3.</h3>
        <h4>This is heading h4.</h4>
        <h5>This is heading h5.</h5>
        <h6>This is heading h6.</h6>

        <div class="image-section">
            <img
                src="https://placehold.co/400x250/24204d/ffffff?text=AI+Image"
                alt="Artificial intelligence image"
            >

            <div class="grey-area"></div>
        </div>

    </div>

</body>
</html>
